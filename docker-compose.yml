services:
  nginx:
    build: srcs/nginx
    depends_on:
      - wordpress
    networks:
      - neet
    ports:
      - "443:443"
    volumes:
      - wp_files:/var/www/html
    restart: unless-stopped

  wordpress:
    build: srcs/wordpress
    depends_on:
      - mariadb
      - redis
    networks:
      - neet
    volumes:
      - wp_files:/var/www/html
    restart: unless-stopped

  mariadb:
    build: srcs/mariadb
    networks:
      - neet
    volumes:
      - db_files:/var/lib/mysql
    restart: unless-stopped

  redis:
    build: srcs/redis
    networks:
      - neet
    restart: unless-stopped

  adminer:
    build: srcs/adminer
    networks:
      - neet
    restart: unless-stopped

  ftp:
    build: srcs/ftp
    volumes:
      - wp_files:/var/www/html
    ports:
      - "2020:20"
      - "2121:21"
      - "${PASV_MIN_PORT}-${PASV_MAX_PORT}:${PASV_MIN_PORT}-${PASV_MAX_PORT}"
    environment:
      - PASV_MIN_PORT=${PASV_MIN_PORT}
      - PASV_MAX_PORT=${PASV_MAX_PORT}
    restart: unless-stopped

  chess:
    build: srcs/chess
    networks:
      - neet
    restart: unless-stopped

  cadvisor:
    build: srcs/cadvisor
    networks:
      - neet
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

volumes:
  wp_files:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /home/atahiri-/data/wordpress

  db_files:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /home/atahiri-/data/mysql

networks:
  neet:
